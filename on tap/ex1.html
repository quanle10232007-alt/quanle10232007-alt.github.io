<section id="ex1">
    <h2>Register Form</h2>
    <form id="regForm">
        <input type="text" id="username" placeholder="Username (5-15 chars)" required>
        <input type="password" id="password" placeholder="Password (letters & numbers)" required>
        <div id="strength">Strength: <span>None</span></div>
        <input type="file" id="profilePics" accept=".JPG,.PNG" required>
        <button type="submit">Register</button>
    </form>
</section>

<script>
    const passwordInput = document.getElementById('password');
    const strengthText = document.querySelector('#strength span');

    passwordInput.addEventListener('input', () => {
        const val = passwordInput.value;
        let strength = "Weak";
        if (val.length > 8 && /[A-Z]/.test(val) && /[0-9]/.test(val)) strength = "Strong";
        else if (val.length > 5 && /[0-9]/.test(val)) strength = "Medium";
        strengthText.textContent = strength;
    })
</script>
