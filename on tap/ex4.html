<!DOCTYPE html>
<html>
<body>
    <div id="menu">
        <div class="item">Appetizers &reg;: Salad (&ge; 5$)</div>
        <div class="item veg">Appetizers &reg;: Soup (&ge; 4$)</div>
        <div class="item">Main Course &sect;: Steak (&ge; 20$)</div>
        <div class="item veg">Desserts: Fruit (&ge; 6$)</div>
    </div>
    <button onclick="filterMenu()">Filter Vegetarian</button>
    <script>
        function filterMenu() {
            let items = document.getElementsByClassName('item');
            for(let i of items) {
                if(!i.classList.contains('veg')) i.style.display = (i.style.display === 'none') ? 'block' : 'none';
            }
        }
    </script>
</body>
</html>
