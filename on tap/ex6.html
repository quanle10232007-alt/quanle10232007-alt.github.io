<!DOCTYPE html>
<html>
<head>
    <style>.hidden { display: none; }</style>
</head>
<body>
    <button onclick="toggleMenu()">Toggle Menu</button>
    <ul id="nav" class="hidden">
        <li>Home &bull;</li>
        <li>Books &copy; &bull;</li>
        <li>Authors &trade; &bull;</li>
        <li>Contact</li>
    </ul>
    <script>
        function toggleMenu() {
            document.getElementById('nav').classList.toggle('hidden');
        }
    </script>
</body>
</html>
