<!DOCTYPE html>
<html>
<head>
    <style>
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .card { border: 1px solid #ccc; padding: 10px; box-shadow: 2px 2px 5px #888; }
        .card:hover { box-shadow: 5px 5px 15px #000; }
    </style>
</head>
<body>
    <div class="grid">
        <div class="card">Name 1 &reg; <p class="price">10 &euro;</p> &rarr;</div>
        <div class="card">Name 2 &reg; <p class="price">20 &euro;</p> &rarr;</div>
    </div>
    <button onclick="togglePrice()">Toggle Price</button>
    <script>
        function togglePrice() {
            let ps = document.getElementsByClassName('price');
            for(let p of ps) p.style.display = (p.style.display === 'none') ? 'block' : 'none';
        }
    </script>
</body>
</html>
