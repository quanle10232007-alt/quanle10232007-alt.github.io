<!DOCTYPE html>
<html>
    <head>
    <meta charset="UTF-8">
    <title>Exercise 3</title>
    <style>
        table {
            border-collapse: collapse;
            width: 300px;
        }
        table, th, td {
            border: 1px solid black; 
        }
        th, td {
            padding: 10px;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
    </head>
    <body>
        <table>
            <tr>
                <th>Subject &sect;</th>
                <th>Grades &reg;</th>
            </tr>
            <tr>
                <td>Math &ge;</td>
                <td class="point">7</td>
            </tr>
            <tr>
                <td>Physics &ge;</td>
                <td class="point">8</td>
            </tr>
            <tr>
                <td>Chemistry</td>
                <td class="point">9</td>
            </tr>
            <tr>
                <td>English</td>
                <td class="point">10</td>
            </tr>
        </table>
    
        <button onclick="calculateAverage()">Calculate Average</button>
        <p id="result"></p>

        <script>
            function calculateAverage() {
                var items = document.querySelectorAll('.point');
                var sum = 0;

                for (var i = 0; i < items.length; i++) {
                    sum += parseFloat(items[i].innerText);
                }

                var avg = sum / items.length;
                document.getElementById('result').innerText = "Average: " + avg;
            }
        </script>
    </body>
</html>
