<!DOCTYPE html>
<html>
<head>
    <style>#news { display: grid; gap: 10px; width: 300px; }</style>
</head>
<body>
    <form id="news">
        <input type="text" placeholder="Full Name" required>
        <input type="email" id="email" placeholder="Email" required>
        <div><input type="radio" name="t" checked> Monthly <input type="radio" name="t"> Yearly</div>
        <div><input type="checkbox" class="int"> Tech <input type="checkbox" class="int"> Music</div>
        <button type="button" onclick="sub()">Subscribe</button>
    </form>
    <script>
        function sub() {
            let e = document.getElementById('email').value;
            let i = document.querySelectorAll('.int:checked').length;
            if(e.includes('@') && i > 0) alert("Valid!");
            else alert("Check email and interests!");
        }
    </script>
</body>
</html>
