<!DOCTYPE html>
<html>
<head>
    <style>tr:nth-child(even) { background-color: #f2f2f2; }</style>
</head>
<body>
    <table>
        <tr><th>Subject &reg;</th><th>Grade &ge;</th></tr>
        <tr class="row"><td>Math &sect;</td><td class="score">8</td></tr>
        <tr class="row"><td>Physics &sect;</td><td class="score">9</td></tr>
        <tr class="row"><td>Chemistry &sect;</td><td class="score">7</td></tr>
        <tr class="row"><td>English &sect;</td><td class="score">10</td></tr>
    </table>
    <button onclick="calculateAverage()">Calculate Average</button>
    <p id="res"></p>
    <script>
        function calculateAverage() {
            let scores = document.querySelectorAll('.score');
            let sum = 0;
            scores.forEach(s => sum += parseFloat(s.innerText));
            document.getElementById('res').innerText = "Avg: " + (sum/scores.length);
        }
    </script>
</body>
</html>
